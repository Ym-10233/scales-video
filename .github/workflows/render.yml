name: Render video
on:
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Linux dependencies for Remotion
        run: |
          sudo apt-get update
          # 在这行末尾加上了 fonts-noto-cjk 和 fonts-noto-cjk-extra
          sudo apt-get install -y libnss3 libdbus-1-3 libatk1.0-0 libgbm-dev libasound2 libxrandr2 libatk-bridge2.0-0 libxkbcommon0 fonts-noto-cjk fonts-noto-cjk-extra

      - run: npm i

      - name: Ensure Chrome Headless Shell
        run: npx remotion browser ensure

      - name: Render Video
        run: npx remotion render Scales30s out/video.mp4 --gl=swangle --concurrency=1

      - uses: actions/upload-artifact@v4
        with:
          name: scales-video
          path: out/video.mp4
