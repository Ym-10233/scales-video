name: Render video
on:
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm i
      - run: npx remotion render ScalesVideo out/video.mp4
      - uses: actions/upload-artifact@v4
        with:
          name: scales-video
          path: out/video.mp4
